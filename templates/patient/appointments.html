{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">FOLLOW-UP</div><h2>Appointments</h2></div></div><div class="panel">{% for a in patient.appointments|sort(attribute='date_time') %}<div class="list-row"><div><b>{{a.purpose}}</b><span>{{a.date_time.strftime('%d %b %Y · %I:%M %p')}} · {{a.doctor.name}}</span></div><span class="status-pill good">{{a.status}}</span></div>{% else %}<p>No appointments recorded.</p>{% endfor %}</div>{% endblock %}
