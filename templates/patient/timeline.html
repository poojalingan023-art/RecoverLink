{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">RECOVERY HISTORY</div><h2>Continuous recovery timeline</h2></div></div><div class="timeline">{% for e in events %}<div class="timeline-item"><div class="timeline-marker"></div><div class="panel"><span class="mini-label">{{e.event_type}}</span><h5>{{e.title}}</h5><p>{{e.description}}</p><small>{{e.created_at.strftime('%d %b %Y · %I:%M %p')}}</small></div></div>{% else %}<div class="panel">No events yet.</div>{% endfor %}</div>{% endblock %}
