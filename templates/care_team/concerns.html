{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">INBOX</div><h2>Patient concerns</h2></div></div><div class="panel">{% for c in concerns %}<div class="list-row"><div><b>{{c.patient.user.name}} · {{c.category}}</b><span>{{c.text or c.voice_transcript}}</span></div><span class="status-pill {{'warn' if c.priority=='YELLOW' else 'danger' if c.priority=='RED' else 'good'}}">{{c.status}}</span></div>{% else %}<p>No concerns.</p>{% endfor %}</div>{% endblock %}
