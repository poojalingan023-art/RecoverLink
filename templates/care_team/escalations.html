{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">ESCALATIONS</div><h2>Doctor review queue</h2></div></div><div class="panel">{% for e in escalations %}<div class="escalation-row"><div><b>{{e.patient.user.name}}</b><span>{{e.level}} · {{e.created_at.strftime('%d %b %Y · %I:%M %p')}}</span><p>{{e.reason}}</p></div><span class="status-pill warn">{{e.status}}</span></div>{% else %}<p>No escalations.</p>{% endfor %}</div>{% endblock %}
