{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">APPOINTMENTS</div><h2>Follow-up schedule</h2></div></div><div class="panel">{% for a in appointments %}<div class="list-row"><div><b>{{a.patient.user.name}} · {{a.purpose}}</b><span>{{a.date_time.strftime('%d %b %Y · %I:%M %p')}}</span></div><span class="status-pill good">{{a.status}}</span></div>{% endfor %}</div>{% endblock %}
