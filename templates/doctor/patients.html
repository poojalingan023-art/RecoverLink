{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">PATIENTS</div><h2>Recovery cases</h2></div></div><div class="panel">{% for p in patients %}<a class="patient-row" href="{{url_for('doctor_patient',pid=p.id)}}"><div class="avatar">{{p.user.name[0]}}</div><div><b>{{p.user.name}}</b><span>{{p.surgeries[-1].surgery_type if p.surgeries else 'Recovery case'}}</span></div><div class="ms-auto d-flex align-items-center gap-2"><span class="small text-muted">{{p.phone_number or p.contact_information}}</span><span>Open patient →</span></div></a>{% endfor %}</div>{% endblock %}
