{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">CARE TEAM</div><h2>Assignments</h2></div></div><div class="panel">{% for a in assignments %}<div class="list-row"><div><b>{{a.patient.user.name}}</b><span>{{a.role}} · {{a.care_team_user.name}}</span></div><span class="tag">{{'Active' if a.active else 'Ended'}}</span></div>{% else %}<p>No assignments.</p>{% endfor %}</div>{% endblock %}
